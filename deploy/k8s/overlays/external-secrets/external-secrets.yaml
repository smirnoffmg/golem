# One ExternalSecret per Secret the base expects: the Secrets themselves are never in git.
# The ClusterSecretStore "golem" is the operator's (Vault, a cloud secret manager, ...); its
# spec.conditions should admit only the golem-system and golem-jobs namespaces.
# Remote keys and properties are placeholders for the store's own layout.
# The run Secret carries non-secret settings too (gateway URL, model): the Job's environment
# comes only from Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: golem-edge
  namespace: golem-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: golem
  target:
    name: golem-edge
    creationPolicy: Owner
  data:
    - secretKey: GOLEM_AUDIT_DSN
      remoteRef:
        key: golem/edge
        property: golem-audit-dsn
---
