        property: golem-tasks-db-url
    - secretKey: GOLEM_PUSH_CONFIG_KEY
      remoteRef:
        key: golem/tasks
        property: golem-push-config-key
    # One value shared by the edge and the task service: the task service trusts the
    # edge's principal header only with it (ADR 0009).
    - secretKey: GOLEM_EDGE_TOKEN
      remoteRef:
        key: golem/edge-token
        property: edge-token
---
