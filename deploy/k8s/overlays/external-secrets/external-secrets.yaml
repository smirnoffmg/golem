apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: golem-mattermost-adapter
  namespace: golem-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: golem
  target:
    name: golem-mattermost-adapter
    creationPolicy: Owner
  data:
    - secretKey: GOLEM_OIDC_CLIENT_SECRET
      remoteRef:
        key: golem/mattermost-adapter
        property: golem-oidc-client-secret
    # The bot account's access token: posts outcomes.
    - secretKey: GOLEM_MATTERMOST_BOT_TOKEN
      remoteRef:
        key: golem/mattermost-adapter
        property: golem-mattermost-bot-token
    # The slash command's token: the only proof a command came from Mattermost.
    - secretKey: GOLEM_MATTERMOST_COMMAND_TOKEN
      remoteRef:
        key: golem/mattermost-adapter
        property: golem-mattermost-command-token
    - secretKey: GOLEM_PUSH_TOKEN_SECRET
      remoteRef:
        key: golem/mattermost-adapter
        property: golem-push-token-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: golem-ui
  namespace: golem-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: golem
  target:
    name: golem-ui
    creationPolicy: Owner
  data:
    - secretKey: GOLEM_OIDC_CLIENT_SECRET
      remoteRef:
        key: golem/ui
        property: golem-oidc-client-secret
    # Role golem_ui, database golem_ui.
    - secretKey: GOLEM_UI_DSN
      remoteRef:
        key: golem/ui
        property: golem-ui-dsn
    # Fernet key: encrypts the tokens in golem_ui. Rotating it signs everyone out.
    - secretKey: GOLEM_UI_SESSION_KEY
      remoteRef:
        key: golem/ui
        property: golem-ui-session-key
---
