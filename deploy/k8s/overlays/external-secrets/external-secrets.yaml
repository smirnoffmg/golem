    creationPolicy: Owner
  data:
    - secretKey: GOLEM_RUNS_DSN
      remoteRef:
        key: golem/tasks
        property: golem-runs-dsn
    - secretKey: GOLEM_TASKS_DB_URL
      remoteRef:
