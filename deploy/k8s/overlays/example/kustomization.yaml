# An example of an operator's overlay: every placeholder of the base replaced for one
# environment (docs/operations/install.md). Copy it, keep the structure, change the values.
# Each network patch first tests the placeholder it replaces, so a change to the base fails
# the build instead of patching the wrong rule.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # With the External Secrets Operator: ../external-secrets instead.
  - ../../base

images:
  - name: golem
    newName: registry.internal/golem
    newTag: "0.1.0"
  # The board's image (board/Dockerfile), built and tagged with the same release.
  - name: golem-board
    newName: registry.internal/golem-board
    newTag: "0.1.0"

patches:
  - path: config.yaml
  # Postgres: 10.20.0.5. The Kubernetes API server's endpoint: 10.0.0.1:6443.
  - target: {kind: NetworkPolicy, name: tasks, namespace: golem-system}
    patch: |-
      - {op: test, path: /spec/egress/1/to/0/ipBlock/cidr, value: 192.0.2.10/32}
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 10.20.0.5/32}
      - {op: test, path: /spec/egress/2/to/0/ipBlock/cidr, value: 192.0.2.1/32}
      - {op: replace, path: /spec/egress/2/to/0/ipBlock/cidr, value: 10.0.0.1/32}
  - target: {kind: NetworkPolicy, name: reconciler, namespace: golem-system}
    patch: |-
      - {op: test, path: /spec/egress/1/to/0/ipBlock/cidr, value: 192.0.2.10/32}
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 10.20.0.5/32}
      - {op: test, path: /spec/egress/2/to/0/ipBlock/cidr, value: 192.0.2.1/32}
      - {op: replace, path: /spec/egress/2/to/0/ipBlock/cidr, value: 10.0.0.1/32}
      - {op: test, path: /spec/egress/3/to/0/ipBlock/cidr, value: 198.51.100.30/32}
      - {op: replace, path: /spec/egress/3/to/0/ipBlock/cidr, value: 10.30.0.30/32}
  # The identity provider: 10.30.0.10.
  - target: {kind: NetworkPolicy, name: edge, namespace: golem-system}
    patch: |-
      - {op: test, path: /spec/egress/1/to/0/ipBlock/cidr, value: 192.0.2.10/32}
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 10.20.0.5/32}
      - {op: test, path: /spec/egress/2/to/0/ipBlock/cidr, value: 198.51.100.10/32}
      - {op: replace, path: /spec/egress/2/to/0/ipBlock/cidr, value: 10.30.0.10/32}
  - target: {kind: NetworkPolicy, name: ui, namespace: golem-system}
    patch: |-
      - {op: test, path: /spec/egress/1/to/0/ipBlock/cidr, value: 198.51.100.10/32}
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 10.30.0.10/32}
      - {op: test, path: /spec/egress/2/to/0/ipBlock/cidr, value: 192.0.2.10/32}
      - {op: replace, path: /spec/egress/2/to/0/ipBlock/cidr, value: 10.20.0.5/32}
  # Jira and Confluence: 10.30.0.20.
  - target: {kind: NetworkPolicy, name: jira-adapter, namespace: golem-system}
    patch: |-
      - {op: test, path: /spec/egress/1/to/0/ipBlock/cidr, value: 198.51.100.10/32}
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 10.30.0.10/32}
      - {op: test, path: /spec/egress/2/to/0/ipBlock/cidr, value: 198.51.100.20/32}
      - {op: replace, path: /spec/egress/2/to/0/ipBlock/cidr, value: 10.30.0.20/32}
  - target: {kind: NetworkPolicy, name: mcp, namespace: golem-system}
    patch: |-
      - {op: test, path: /spec/egress/1/to/0/ipBlock/cidr, value: 192.0.2.10/32}
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 10.20.0.5/32}
      - {op: test, path: /spec/egress/2/to/0/ipBlock/cidr, value: 198.51.100.20/32}
      - {op: replace, path: /spec/egress/2/to/0/ipBlock/cidr, value: 10.30.0.20/32}
  # Mattermost: 10.30.0.60, both for its slash commands in and the REST API out.
  - target: {kind: NetworkPolicy, name: mattermost-adapter, namespace: golem-system}
    patch: |-
      - {op: test, path: /spec/ingress/0/from/0/ipBlock/cidr, value: 203.0.113.30/32}
      - {op: replace, path: /spec/ingress/0/from/0/ipBlock/cidr, value: 10.30.0.60/32}
      - {op: test, path: /spec/egress/1/to/0/ipBlock/cidr, value: 198.51.100.10/32}
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 10.30.0.10/32}
      - {op: test, path: /spec/egress/2/to/0/ipBlock/cidr, value: 203.0.113.30/32}
      - {op: replace, path: /spec/egress/2/to/0/ipBlock/cidr, value: 10.30.0.60/32}
  # Runs: the model gateway (10.30.0.40:4000), the trace store (10.30.0.50:443), GitLab.
  - target: {kind: NetworkPolicy, name: golem-run-egress, namespace: golem-jobs}
    patch: |-
      - {op: test, path: /spec/egress/2/to/0/ipBlock/cidr, value: 203.0.113.10/32}
      - {op: replace, path: /spec/egress/2/to/0/ipBlock/cidr, value: 10.30.0.40/32}
      - {op: test, path: /spec/egress/3/to/0/ipBlock/cidr, value: 203.0.113.20/32}
      - {op: replace, path: /spec/egress/3/to/0/ipBlock/cidr, value: 10.30.0.50/32}
      - {op: test, path: /spec/egress/4/to/0/ipBlock/cidr, value: 198.51.100.30/32}
      - {op: replace, path: /spec/egress/4/to/0/ipBlock/cidr, value: 10.30.0.30/32}
