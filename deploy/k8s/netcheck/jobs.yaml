---
# Another run, for the run client to fail to reach. It has no "open" check anywhere (nothing
# may reach a run), so its headless Service stands in: the name resolves only while the pod is
# Ready, and Ready means its own probe got an answer from the listener.
apiVersion: batch/v1
kind: Job
metadata:
  name: netcheck-run-listener
  namespace: golem-jobs
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golem-run
        golem.dev/netcheck: run-listener
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: listener
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              mkdir -p /tmp/www && echo netcheck > /tmp/www/index.html
              && httpd -p 8000 -h /tmp/www || exit 1;
              trap 'exit 0' TERM; sleep 300 & wait
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/"]
            periodSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netcheck-run-listener
  namespace: golem-jobs
spec:
  clusterIP: None
  selector:
    golem.dev/netcheck: run-listener
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# The canary: a listener in a namespace without NetworkPolicies, which no egress rule admits.
# Only a client's own egress rules can refuse it, so while a client still reaches it, those
# rules are not in force yet. Its name resolves only while it is Ready.
apiVersion: v1
kind: Namespace
metadata:
  name: golem-netcheck
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: batch/v1
kind: Job
metadata:
  name: netcheck-canary
  namespace: golem-netcheck
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        golem.dev/netcheck: canary
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: listener
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              mkdir -p /tmp/www && echo netcheck > /tmp/www/index.html
              && httpd -p 8000 -h /tmp/www || exit 1;
              trap 'exit 0' TERM; sleep 300 & wait
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/"]
            periodSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netcheck-canary
  namespace: golem-netcheck
spec:
  clusterIP: None
  selector:
    golem.dev/netcheck: canary
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Prometheus: the metrics port of every process it checks, never a port callers use (ADR 0013).
# It lives in a namespace of its own with the monitoring label and no policies, so only the
# processes' ingress rules decide; nothing to settle. It checks the processes the other
# clients check, whose public ports are proven listening by their "open" checks.
apiVersion: v1
kind: Namespace
metadata:
  name: golem-netcheck-monitoring
  labels:
    golem.dev/monitoring: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
