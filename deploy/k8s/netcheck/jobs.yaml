# Each client wears the labels of the process it stands in for, so the process's own policy
# governs it; every "closed" target is some other check's "open", or the run listener, so a
# closed verdict cannot pass because nothing was listening. Each first waits until its egress
# rules are in force (netcheck.sh, settled), on the canary below.

# A run: the edge and the MCP servers, never the task service, Postgres or another run.
apiVersion: batch/v1
kind: Job
metadata:
  name: netcheck-run
  namespace: golem-jobs
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golem-run
        golem.dev/netcheck: run
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netcheck
          image: busybox:1.37
          command: ["sh", "/etc/netcheck/netcheck.sh"]
          args:
            - "settled:netcheck-canary.golem-netcheck.svc.cluster.local:8000"
            - "dns:kubernetes.default.svc.cluster.local"
            - "dns:netcheck-run-listener.golem-jobs.svc.cluster.local"
            - "open:edge.golem-system.svc:8000"
            - "open:mcp-tracker-read.golem-system.svc:8000"
            - "open:mcp-wiki-read.golem-system.svc:8000"
            - "closed:tasks.golem-system.svc:8000"
            - "closed:tasks.golem-system.svc:8001"
            - "closed:tasks.golem-system.svc:8002"
            - "closed:$(NETCHECK_POSTGRES)"
            - "closed:netcheck-run-listener.golem-jobs.svc.cluster.local:8000"
          env:
            - name: NETCHECK_POSTGRES
              valueFrom:
                configMapKeyRef:
                  name: golem-netcheck
                  key: NETCHECK_POSTGRES
          # Never Ready while it runs (the delay outlasts activeDeadlineSeconds), so a Service
          # selecting the process's labels never sends it real traffic.
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 3600
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: netcheck
              mountPath: /etc/netcheck
              readOnly: true
      volumes:
        - name: netcheck
          configMap:
            name: golem-netcheck
            items:
              - key: netcheck.sh
                path: netcheck.sh
---
