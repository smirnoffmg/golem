apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The network check after deploy (deploy/k8s/README.md, "Verify the network after deploy"):
# one-shot Jobs that stand in for the processes and try the traffic matrix of ADR 0009 under
# the policies actually enforced by the cluster's CNI. Apply it after the platform, never with
# it: kubectl delete -k deploy/k8s/netcheck; kubectl apply -k deploy/k8s/netcheck
resources:
  - jobs.yaml

labels:
  - pairs:
      app.kubernetes.io/component: netcheck
    includeTemplates: true

# Jobs are immutable and are recreated for every check, so the names stay stable.
generatorOptions:
  disableNameSuffixHash: true

# NETCHECK_POSTGRES is the Postgres address of the policies (a placeholder, like theirs); an
# overlay merges the real one into both.
configMapGenerator:
  - name: golem-netcheck
    namespace: golem-system
    files:
      - netcheck.sh
    literals:
      - NETCHECK_POSTGRES=192.0.2.10:5432
  - name: golem-netcheck
    namespace: golem-jobs
    files:
      - netcheck.sh
    literals:
      - NETCHECK_POSTGRES=192.0.2.10:5432
