# Default deny, then one policy per process with both its ingress and its egress, so a
# process's whole network surface is read in one place. ipBlock entries in the TEST-NET ranges
# (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) are placeholders an environment replaces;
# deploy/k8s/README.md lists them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: golem-system
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Every process calls others by Service name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: golem
    # The board calls nothing and serves no metrics (ADR 0018).
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: ["golem-board"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Every process serves its metrics on a port of its own (ADR 0013). Only the monitoring
# namespace reaches it, and nothing else of a process; no process policy opens 9090. Placeholder:
# the namespace of Prometheus, labelled by the operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: golem
    # The board calls nothing and serves no metrics (ADR 0018).
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: ["golem-board"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              golem.dev/monitoring: "true"
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-edge
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        # Placeholder: the namespace of the ingress controller, labelled by the operator.
        - namespaceSelector:
            matchLabels:
              golem.dev/ingress-controller: "true"
        # Runs asking another agent (ADR 0004).
        - namespaceSelector:
            matchLabels:
              golem.dev/zone: jobs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-run
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-jira-adapter
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-mattermost-adapter
        # The web UI, calling with each signed-in user's own token (ADR 0011).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-ui
        # The reconciler, starting processes' stages with call tokens (ADR 0019).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-reconciler
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # A2A, and the run keys that verify the call tokens runs delegate with (ADR 0014).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-tasks
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
    # Placeholder: Postgres (golem_audit).
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
    # Placeholder: the identity provider (JWKS).
    - to:
        - ipBlock:
            cidr: 198.51.100.10/32
      ports:
        - protocol: TCP
          port: 443
---
# Not reachable from outside (ADR 0002). Policies work on ports, not paths, so each caller is
# admitted to its own listeners only (ADR 0009): the edge to A2A and the run keys, the MCP
# servers to run keys and run status, the reconciler to run outcomes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tasks
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-tasks
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-edge
      ports:
        - protocol: TCP
          port: 8000
    # The run keys: the MCP servers verify run tokens, the write servers proposal tokens (and
    # ask a proposal's state), the edge call tokens.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-mcp
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-mcp-write
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-edge
      ports:
        - protocol: TCP
          port: 8001
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-reconciler
      ports:
        - protocol: TCP
          port: 8002
  egress:
    # Push notifications.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-jira-adapter
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-mattermost-adapter
      ports:
        - protocol: TCP
          port: 8000
    # Placeholder: Postgres (golem_tasks, golem_runs).
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
    # Placeholder: the Kubernetes API server's endpoint address, not the kubernetes Service's
    # ClusterIP: policies see traffic after the Service address is translated.
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Accepted proposals, applied through the write servers (ADR 0015). Last, so an overlay's
    # patches by index to the rules above still apply.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-mcp-write
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reconciler
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-reconciler
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-tasks
      ports:
        - protocol: TCP
          port: 8002
    # Placeholder: Postgres (golem_runs).
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
    # Placeholder: the Kubernetes API server's endpoint address (see the tasks policy).
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Placeholder: GitLab (merge requests).
    - to:
        - ipBlock:
            cidr: 198.51.100.30/32
      ports:
        - protocol: TCP
          port: 443
    # The edge's a2a port, where processes' stages start (ADR 0019). Last, so overlays that
    # patch the placeholders above by index keep working.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-edge
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jira-adapter
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-jira-adapter
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Jira webhooks, through the ingress controller (placeholder label, as for the edge).
    - from:
        - namespaceSelector:
            matchLabels:
              golem.dev/ingress-controller: "true"
      ports:
        - protocol: TCP
          port: 8000
    # Push notifications.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-tasks
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-edge
      ports:
        - protocol: TCP
          port: 8000
    # Placeholder: the identity provider (client credentials).
    - to:
        - ipBlock:
            cidr: 198.51.100.10/32
      ports:
        - protocol: TCP
          port: 443
    # Placeholder: Jira.
    - to:
        - ipBlock:
            cidr: 198.51.100.20/32
      ports:
        - protocol: TCP
          port: 443
---
# The slash command's only credential is a shared token in a header (ADR 0010), so who may
# send one is narrowed here too: the Mattermost server alone. If commands arrive through the
# ingress controller instead, the policy sees the controller: admit its namespace and restrict
# the source to Mattermost at the ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattermost-adapter
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-mattermost-adapter
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Placeholder: the Mattermost server (slash commands).
    - from:
        - ipBlock:
            cidr: 203.0.113.30/32
      ports:
        - protocol: TCP
          port: 8000
    # Push notifications.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-tasks
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-edge
      ports:
        - protocol: TCP
          port: 8000
    # Placeholder: the identity provider (client credentials).
    - to:
        - ipBlock:
            cidr: 198.51.100.10/32
      ports:
        - protocol: TCP
          port: 443
    # Placeholder: the Mattermost server (REST API, posts).
    - to:
        - ipBlock:
            cidr: 203.0.113.30/32
      ports:
        - protocol: TCP
          port: 443
---
# Only runs call the MCP servers; the servers call the task service, the audit log and the
# system behind their group.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-mcp
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              golem.dev/zone: jobs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-run
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-tasks
      ports:
        - protocol: TCP
          port: 8001
    # Placeholder: Postgres (golem_audit).
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
    # Placeholder: Jira and Confluence.
    - to:
        - ipBlock:
            cidr: 198.51.100.20/32
      ports:
        - protocol: TCP
          port: 443
---
# Only the task service calls the write servers (ADR 0015); no run can open a connection to one.
# The servers call the task service, the audit log and the system behind their group.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-write
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-mcp-write
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-tasks
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-tasks
      ports:
        - protocol: TCP
          port: 8001
    # Placeholder: Postgres (golem_audit).
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
    # Placeholder: Jira and Confluence.
    - to:
        - ipBlock:
            cidr: 198.51.100.20/32
      ports:
        - protocol: TCP
          port: 443
---
# Browsers through the ingress controller; out to the edge, the identity provider (discovery,
# token endpoint, keys) and Postgres (golem_ui). ADRs 0011 and 0018.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-ui
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Placeholder: the namespace of the ingress controller, labelled by the operator.
    - from:
        - namespaceSelector:
            matchLabels:
              golem.dev/ingress-controller: "true"
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golem-edge
      ports:
        - protocol: TCP
          port: 8000
    # Placeholder: the identity provider.
    - to:
        - ipBlock:
            cidr: 198.51.100.10/32
      ports:
        - protocol: TCP
          port: 443
    # Placeholder: Postgres (golem_ui).
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
---
# Browsers through the ingress controller, and nothing out: the static server calls nothing,
# not even DNS (ADR 0018).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board
  namespace: golem-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golem-board
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Placeholder: the namespace of the ingress controller, labelled by the operator.
    - from:
        - namespaceSelector:
            matchLabels:
              golem.dev/ingress-controller: "true"
      ports:
        - protocol: TCP
          port: 8080
