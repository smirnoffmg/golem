# The A2A edge: the only door (ADR 0002). Stateless, two replicas; fails closed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golem-edge-env
  namespace: golem-system
data:
  GOLEM_OIDC_ISSUER: https://idp.example.com/realms/golem
  GOLEM_OIDC_AUDIENCE: golem-edge
  GOLEM_OIDC_JWKS_URL: https://idp.example.com/realms/golem/protocol/openid-connect/certs
  GOLEM_OIDC_DISCOVERY_URL: https://idp.example.com/realms/golem/.well-known/openid-configuration
  GOLEM_CALL_REGISTRY_FILE: /etc/golem/call-registry.yaml
  GOLEM_MAX_CHAIN_DEPTH: "4"
  # The task service's a2a port.
  GOLEM_TASK_SERVICE_URL: http://tasks.golem-system.svc:8000
  # The example catalogs baked into the image; an environment mounts its own.
  GOLEM_CATALOGS_DIR: /app/examples
  GOLEM_PUBLIC_BASE_URL: https://golem.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: golem-system
  labels:
    app.kubernetes.io/name: golem-edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: golem-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golem-edge
        app.kubernetes.io/part-of: golem
    spec:
      serviceAccountName: golem-edge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: golem
          command: ["python", "-m", "golem.edge"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: golem-edge-env
            - secretRef:
                name: golem-edge
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # TCP: the edge has no health route, and every HTTP route depends on a token or an
          # agent name.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/golem
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: golem-config
            items:
              - key: call-registry.yaml
                path: call-registry.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: golem-system
spec:
  selector:
    app.kubernetes.io/name: golem-edge
  ports:
    - name: http
      port: 8000
      targetPort: http
