# The A2A edge: the only door (ADR 0002). Stateless, two replicas; fails closed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golem-edge-env
  namespace: golem-system
data:
  GOLEM_OIDC_ISSUER: https://idp.example.com/realms/golem
  GOLEM_OIDC_AUDIENCE: golem-edge
  GOLEM_OIDC_JWKS_URL: https://idp.example.com/realms/golem/protocol/openid-connect/certs
  GOLEM_OIDC_DISCOVERY_URL: https://idp.example.com/realms/golem/.well-known/openid-configuration
  GOLEM_CALL_REGISTRY_FILE: /etc/golem/call-registry.yaml
  GOLEM_MAX_CHAIN_DEPTH: "4"
  # The task service's a2a port.
  GOLEM_TASK_SERVICE_URL: http://tasks.golem-system.svc:8000
  # The task service's internal-read port: the keys that verify call tokens, and the run
  # statuses that revoke them (ADR 0014).
  GOLEM_TASK_SERVICE_READ_URL: http://tasks.golem-system.svc:8001
  # The example catalogs baked into the image; an environment mounts its own.
  GOLEM_CATALOGS_DIR: /app/examples
  GOLEM_PUBLIC_BASE_URL: https://golem.example.com
  # Signs the public agent cards; its own key, rotated apart from the run token key (ADR 0014).
  GOLEM_CARD_SIGNING_KEY_FILE: /var/run/golem/card-signing/key.pem
  GOLEM_CARD_SIGNING_KID: golem-cards-1
  # Placeholder: the addresses of the ingress controller's pods (ADR 0012). Rate limits key
  # on the client address, which behind the controller is only in X-Forwarded-For.
  GOLEM_TRUSTED_PROXIES: 192.0.2.128/25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: golem-system
  labels:
    app.kubernetes.io/name: golem-edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: golem-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golem-edge
        app.kubernetes.io/part-of: golem
    spec:
      serviceAccountName: golem-edge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: golem
          command: ["python", "-m", "golem.edge"]
          ports:
            - name: http
              containerPort: 8000
            # Scraped from the monitoring namespace only (ADR 0013).
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: golem-edge-env
            - secretRef:
                name: golem-edge
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # TCP: the edge has no health route, and every HTTP route depends on a token, an
          # agent name or a per-address rate limit the kubelet's probes would share.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/golem
              readOnly: true
            - name: card-signing-key
              mountPath: /var/run/golem/card-signing
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: golem-config
            items:
              - key: call-registry.yaml
                path: call-registry.yaml
        - name: card-signing-key
          secret:
            secretName: golem-card-signing-key
            # Group-readable through fsGroup; the container user is not the file's owner.
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: golem-system
spec:
  selector:
    app.kubernetes.io/name: golem-edge
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
