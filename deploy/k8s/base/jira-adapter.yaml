# The Jira adapter: Jira webhooks in through the ingress controller, SendMessage out to the
# edge, task push notifications in from the task service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golem-jira-adapter-env
  namespace: golem-system
data:
  GOLEM_EDGE_URL: http://edge.golem-system.svc:8000
  GOLEM_OIDC_TOKEN_URL: https://idp.example.com/realms/golem/protocol/openid-connect/token
  GOLEM_OIDC_CLIENT_ID: golem-jira-adapter
  GOLEM_JIRA_URL: https://jira.example.com
  # Empty: Jira Data Center, GOLEM_JIRA_TOKEN is a personal access token. Jira Cloud: the
  # account's email, and GOLEM_JIRA_TOKEN is its API token.
  GOLEM_JIRA_USER: ""
  GOLEM_JIRA_LABELS_FILE: /etc/golem/jira-labels.yaml
  # Where the task service delivers pushes: in-cluster, and within its
  # GOLEM_PUSH_ALLOWED_PREFIXES.
  GOLEM_PUBLIC_BASE_URL: http://jira-adapter.golem-system.svc:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-adapter
  namespace: golem-system
  labels:
    app.kubernetes.io/name: golem-jira-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golem-jira-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golem-jira-adapter
        app.kubernetes.io/part-of: golem
    spec:
      serviceAccountName: golem-jira-adapter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jira-adapter
          image: golem
          command: ["python", "-m", "golem.adapters"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: golem-jira-adapter-env
            - secretRef:
                name: golem-jira-adapter
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # TCP: both routes are signed POSTs; there is no health route.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/golem
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: golem-config
            items:
              - key: jira-labels.yaml
                path: jira-labels.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: jira-adapter
  namespace: golem-system
spec:
  selector:
    app.kubernetes.io/name: golem-jira-adapter
  ports:
    - name: http
      port: 8000
      targetPort: http
