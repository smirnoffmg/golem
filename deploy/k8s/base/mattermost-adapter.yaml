# The Mattermost adapter: /golem slash commands in from the Mattermost server, SendMessage out
# to the edge, task push notifications in from the task service, outcomes out as posts through
# Mattermost's REST API (ADR 0010).
apiVersion: v1
kind: ConfigMap
metadata:
  name: golem-mattermost-adapter-env
  namespace: golem-system
data:
  GOLEM_EDGE_URL: http://edge.golem-system.svc:8000
  GOLEM_OIDC_TOKEN_URL: https://idp.example.com/realms/golem/protocol/openid-connect/token
  GOLEM_OIDC_CLIENT_ID: golem-mattermost-adapter
  GOLEM_MATTERMOST_URL: https://mattermost.example.com
  # Agents the command may start; each needs service:golem-mattermost-adapter in the call
  # registry.
  GOLEM_MATTERMOST_AGENTS: discovery
  # Placeholders: Mattermost team ids (and optionally channel ids) where the command is
  # enabled. No channel list: every channel of these teams.
  GOLEM_MATTERMOST_TEAMS: replace-with-team-id
  GOLEM_MATTERMOST_CHANNELS: ""
  # Where the task service delivers pushes: in-cluster, and within its
  # GOLEM_PUSH_ALLOWED_PREFIXES.
  GOLEM_PUBLIC_BASE_URL: http://mattermost-adapter.golem-system.svc:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost-adapter
  namespace: golem-system
  labels:
    app.kubernetes.io/name: golem-mattermost-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golem-mattermost-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golem-mattermost-adapter
        app.kubernetes.io/part-of: golem
    spec:
      serviceAccountName: golem-mattermost-adapter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mattermost-adapter
          image: golem
          command: ["python", "-m", "golem.adapters", "mattermost"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: golem-mattermost-adapter-env
            - secretRef:
                name: golem-mattermost-adapter
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # TCP: both routes are authenticated POSTs; there is no health route.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost-adapter
  namespace: golem-system
spec:
  selector:
    app.kubernetes.io/name: golem-mattermost-adapter
  ports:
    - name: http
      port: 8000
      targetPort: http
