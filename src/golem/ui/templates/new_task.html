{% extends "base.html" %}
{% block title %}Golem: new task{% endblock %}
{% block main %}
<h1>New task</h1>
<form method="post" action="/tasks">
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  <input type="hidden" name="nonce" value="{{ nonce }}">
  <label for="agent">Agent</label>
  <select id="agent" name="agent">
    {% for agent in agents %}
    <option value="{{ agent }}"{% if agent == chosen %} selected{% endif %}>{{ agent }}</option>
    {% endfor %}
  </select>
  <label for="goal">Goal</label>
  <textarea id="goal" name="goal" rows="6" maxlength="{{ max_goal }}" required></textarea>
  <button type="submit">Start</button>
</form>
{% endblock %}
