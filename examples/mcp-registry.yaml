# The platform's MCP registry, mounted into every Job at GOLEM_MCP_REGISTRY. It belongs to the
# platform, not to an agent catalog: a role's `tools` name groups from here, and a role gets
# exactly the groups it names. Each group is one MCP server (streamable HTTP) and the tool
# names the group allows; other tools that server offers stay out of reach.
tracker.read:
  url: http://mcp-tracker.golem.svc/mcp
  tools: [search_issues, get_issue]
wiki.read:
  url: http://mcp-wiki.golem.svc/mcp
  tools: [search_pages, get_page, get_page_source]
# Served by the runtime itself, not an MCP server: `delegate_to_agent` asks another agent for
# work through the edge, with the run's call token (ADR 0014). The url is the edge's A2A
# endpoint; the edge's call registry decides which agents this agent may call.
agents.delegate:
  url: http://edge.golem.svc:8000/a2a
  tools: [delegate_to_agent]
