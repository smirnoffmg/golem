name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-uv publishes no floating major tag, so it is pinned to a commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      # The same hooks as locally (ruff at the version in uv.lock, YAML/TOML, private keys).
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest

  # The board (ADR 0018): type check, lint, unit tests and the production build.
  board:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: board/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  # A second stage: the real image as a Job in k3s, and the board's image with the real UI in
  # Chromium. It runs only after the fast checks pass.
  e2e:
    needs: [check, board]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      # The headless shell is what headless Chromium runs; --with-deps adds its system libraries.
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest -m e2e
