# The board's static server (ADR 0018): index.html and hashed assets, nothing else. It runs as
# a non-root user on a read-only root filesystem; everything it writes goes under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # It takes no request bodies; the API is another container.
    client_max_body_size 1k;

    # Hashed files never change under their name; everything else must be revalidated, so a
    # deploy reaches browsers at once. Only a found file is immutable: a 404 for an asset a
    # browser asked for in the middle of a deploy must not stick for a year.
    map "$status:$uri" $cache_control {
        ~^(200|304):/assets/ "public, max-age=31536000, immutable";
        default "no-cache";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # All at the server level with `always`: a location with an add_header of its own would
        # drop every one of these, and without `always` error answers would carry none.
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Browsers ignore it over plain HTTP (RFC 6797, 8.1), so it needs no templating.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control $cache_control always;

        location / {
            limit_except GET {
                deny all;
            }
            # The board's own routes (/agents/<name>, /agents/<name>/tasks/<id>) survive a reload.
            try_files $uri /index.html;
        }

        location /assets/ {
            limit_except GET {
                deny all;
            }
            try_files $uri =404;
        }
    }
}
