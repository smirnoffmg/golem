[project]
name = "golem"
version = "0.1.0"
description = "A runtime for autonomous agents: agents are text in a catalog, runs are A2A tasks, results are merge requests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.1,<2",
    "kubernetes>=33",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11,<3",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "httpx>=0.28",
    "ruff>=0.13",
    "testcontainers[k3s,postgres]>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
