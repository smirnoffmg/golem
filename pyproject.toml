[project]
name = "golem"
version = "0.1.0"
description = "A runtime for autonomous agents: agents are text in a catalog, runs are A2A tasks, results are merge requests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server,postgresql]>=1.1,<2",
    "deepagents>=0.7",
    "kubernetes>=33",
    "langchain-mcp-adapters>=0.2",
    "langchain-openai>=0.3",
    "mcp>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "opentelemetry-sdk>=1.36",
    "prometheus-client>=0.22",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11,<3",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "httpx>=0.28",
    "ruff>=0.13",
    "testcontainers[k3s,postgres]>=4",
    "pre-commit>=4",
    "playwright>=1.50",
    "mypy>=2.3.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-protobuf>=7.35.1.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Slow checks in a real cluster (the image as a Job, network traffic) and in a real browser
# (the web UI in Chromium); CI runs them as their own stage after the fast checks.
addopts = "-m 'not e2e'"
markers = ["e2e: slow checks in a real cluster or browser (run with -m e2e)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/golem"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# The Kubernetes client ships neither type hints nor a py.typed marker.
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true
